<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pietro Impellizzeri Foto & VIDEO - Archivio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; }
        .header { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 1.4em; color: #f39c12; }
        .header p { font-size: 0.85em; opacity: 0.9; margin-top: 5px; }
        .nav { display: flex; justify-content: center; gap: 10px; padding: 12px; background: #2c3e50; flex-wrap: wrap; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9em; transition: background 0.3s; }
        .nav a:hover { background: #c0392b; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .section { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filters select { padding: 8px; border-radius: 6px; border: 2px solid #ddd; }
        .client-list { display: grid; gap: 12px; }
        .client-card {
            background: #f8f9fa; border-left: 4px solid #c0392b; padding: 15px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .client-info h3 { color: #333; font-size: 1em; }
        .client-info p { color: #666; font-size: 0.85em; }
        .client-actions { display: flex; gap: 8px; }
        .client-actions button {
            padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8em;
        }
        .btn-open { background: #3498db; color: white; }
        .btn-edit { background: #f39c12; color: white; }
        .btn-pdf { background: #8e44ad; color: white; }
        .btn-group-top { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-group-top button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-backup { background: #e67e22; color: white; }
        .btn-restore { background: #16a085; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📁 Archivio Completo</h1>
        <p>Pietro Impellizzeri Foto & VIDEO | Via Sommariva 43 Capaci (PA)</p>
    </div>
    <div class="nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="clienti.html">📝 Nuovo</a>
        <a href="preventivi.html">📊 Preventivi</a>
        <a href="contratti.html">📜 Contratti</a>
        <a href="logout.html">🚪 Esci</a>
    </div>

    <div class="container">
        <div class="section">
            <div class="btn-group-top">
                <button class="btn-backup" onclick="scaricaBackup()">📥 Scarica Backup</button>
                <button class="btn-restore" onclick="document.getElementById('restoreFile').click()">📤 Ripristina</button>
                <input type="file" id="restoreFile" style="display:none" accept=".json" onchange="ripristinaBackup(event)">
            </div>

            <div class="filters">
                <select id="filtroServizio" onchange="filtraClienti()">
                    <option value="">Tutti i servizi</option>
                    <option>Matrimonio</option><option>Comunione</option><option>Battesimo</option>
                    <option>Compleanno</option><option>Evento</option><option>Anniversario</option>
                    <option>Maternity</option><option>New Born</option><option>SOLO STAMPE</option>
                </select>
            </div>

            <div class="client-list" id="clientList"></div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        if (!isAuthenticated()) { window.location.href = 'login.html'; }

        function caricaClienti() {
            const clienti = JSON.parse(localStorage.getItem('glClienti') || '[]');
            const filtro = document.getElementById('filtroServizio').value;
            const lista = document.getElementById('clientList');
            lista.innerHTML = '';

            const filtrati = filtro ? clienti.filter(c => c.servizio === filtro) : clienti;

            if (filtrati.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#999;">Nessun cliente trovato.</p>';
                return;
            }

            filtrati.forEach(c => {
                const card = document.createElement('div');
                card.className = 'client-card';
                card.innerHTML = `
                    <div class="client-info">
                        <h3>${c.c1.cognome} ${c.c1.nome} ${c.c2 && c.c2.nome ? '& ' + c.c2.cognome + ' ' + c.c2.nome : ''}</h3>
                        <p>📅 ${c.dataEvento || 'N/D'} |  ${c.servizio || 'N/D'} |  € ${c.importoTotale || '0.00'}</p>
                    </div>
                    <div class="client-actions">
                        <button class="btn-open" onclick="apriCliente(${c.id})">📂 Apri</button>
                        <button class="btn-edit" onclick="modificaCliente(${c.id})">✏️ Modifica</button>
                        <button class="btn-pdf" onclick="generaPDF(${c.id})">📄 PDF</button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        function filtraClienti() { caricaClienti(); }

        function apriCliente(id) { alert('Apertura cliente #' + id); }
        function modificaCliente(id) { alert('Modifica cliente #' + id); }
        function generaPDF(id) { alert('Generazione PDF cliente #' + id); }

        function scaricaBackup() {
            const backup = {
                clienti: JSON.parse(localStorage.getItem('glClienti') || '[]'),
                preventivi: JSON.parse(localStorage.getItem('glPreventivi') || '[]'),
                contratti: JSON.parse(localStorage.getItem('glContratti') || '[]'),
                data: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'backup_gl_' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
        }

        function ripristinaBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.clienti) localStorage.setItem('glClienti', JSON.stringify(data.clienti));
                    if (data.preventivi) localStorage.setItem('glPreventivi', JSON.stringify(data.preventivi));
                    if (data.contratti) localStorage.setItem('glContratti', JSON.stringify(data.contratti));
                    alert('✅ Backup ripristinato!');
                    caricaClienti();
                } catch (err) { alert('❌ Errore nel file.'); }
            };
            reader.readAsText(file);
        }

        caricaClienti();
    </script>
</body>
</html>
