<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Pietro Impellizzeri Foto & Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-container {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logout-container h1 { color: #c0392b; margin-bottom: 15px; }
        .logout-container p { color: #555; margin-bottom: 25px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.95em;
        }
        .btn-home { background: #27ae60; color: white; }
        .btn-close { background: #c0392b; color: white; }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>Disconnessione</h1>
        <p>Grazie per aver usato Pietro Impellizzeri Foto & Video</p>
        <div class="btn-group">
            <a href="login.html" class="btn btn-home" onclick="eseguiLogout()">🏠 Accedi</a>
            <button class="btn btn-close" onclick="chiudiPagina()">❌ Chiudi</button>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        function eseguiLogout() {
            logoutUser();
        }
        function chiudiPagina() {
            logoutUser();
            window.open('', '_self', '');
            window.close();
            setTimeout(() => {
                document.body.innerHTML = '<p style="text-align:center; color:white; margin-top:50px;">Puoi chiudere questa scheda.</p>';
            }, 100);
        }
        eseguiLogout();
    </script>
</body>
</html>
