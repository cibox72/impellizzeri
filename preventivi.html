<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pietro Impellizzeri Foto & Video - Archivio Preventivi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; }
        .header { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 1.4em; color: #f39c12; }
        .header p { font-size: 0.85em; opacity: 0.9; margin-top: 5px; }
        .nav { display: flex; justify-content: center; gap: 10px; padding: 12px; background: #2c3e50; flex-wrap: wrap; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9em; transition: background 0.3s; }
        .nav a:hover { background: #c0392b; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .section { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filters select { padding: 8px; border-radius: 6px; border: 2px solid #ddd; font-size: 0.9em; }
        .prev-list { display: grid; gap: 12px; }
        .prev-card {
            background: #f8f9fa; border-left: 4px solid #3498db; padding: 15px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .prev-info h3 { color: #333; font-size: 1em; }
        .prev-info p { color: #666; font-size: 0.85em; margin-top: 3px; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75em; font-weight: bold; color: white; display: inline-block; margin-top: 5px; }
        .badge-bozza { background: #95a5a6; }
        .badge-inviato { background: #3498db; }
        .badge-accettato { background: #27ae60; }
        .badge-rifiutato { background: #e74c3c; }
        .btn-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-actions button {
            padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 0.8em; font-weight: bold; color: white; transition: transform 0.2s;
        }
        .btn-actions button:hover { transform: translateY(-2px); }
        .btn-view { background: #3498db; }
        .btn-accept { background: #27ae60; }
        .btn-reject { background: #e74c3c; }
        .btn-delete { background: #95a5a6; }
        .btn-pdf { background: #8e44ad; }
        
        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
            padding: 20px; overflow-y: auto;
        }
        .modal-content {
            background: white; border-radius: 12px; padding: 30px; max-width: 800px; width: 100%;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .modal-header h2 { color: #c0392b; }
        .close-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .detail-item { background: #f8f9fa; padding: 12px; border-radius: 8px; }
        .detail-item label { font-size: 0.8em; color: #666; font-weight: bold; display: block; margin-bottom: 4px; }
        .detail-item span { font-size: 0.95em; color: #333; }
        .section-title { font-size: 1.1em; color: #c0392b; margin: 20px 0 10px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Archivio Preventivi</h1>
        <p>Pietro Impellizzeri Foto & Video | Via Sommariva 43, Capaci (PA)</p>
    </div>
    <div class="nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="clienti.html">📝 Nuovo Preventivo</a>
        <a href="contratti.html">📜 Contratti</a>
        <a href="archivio.html">📁 Archivio Completo</a>
        <a href="logout.html">🚪 Esci</a>
    </div>

    <div class="container">
        <div class="section">
            <div class="filters">
                <select id="filtroStato" onchange="filtraPreventivi()">
                    <option value="">Tutti gli stati</option>
                    <option>Bozza</option><option>Inviato</option><option>Accettato</option><option>Rifiutato</option>
                </select>
            </div>
            <div class="prev-list" id="prevList"></div>
        </div>
    </div>

    <!-- Modal Dettaglio -->
    <div class="modal" id="dettaglioModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2> Dettaglio Preventivo</h2>
                <button class="close-btn" onclick="chiudiModal()">❌ Chiudi</button>
            </div>
            <div id="dettaglioContent"></div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        if (!isAuthenticated()) { window.location.href = 'login.html'; }

        let preventivi = [];

        function caricaPreventivi() {
            preventivi = JSON.parse(localStorage.getItem('pietroClienti') || '[]');
            filtraPreventivi();
        }

        function filtraPreventivi() {
            const filtro = document.getElementById('filtroStato').value;
            const lista = document.getElementById('prevList');
            lista.innerHTML = '';

            const filtrati = filtro ? preventivi.filter(c => c.stato === filtro) : preventivi;

            if (filtrati.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">Nessun preventivo trovato.</p>';
                return;
            }

            filtrati.forEach(c => {
                const card = document.createElement('div');
                card.className = 'prev-card';
                const badgeClass = 'badge-' + (c.stato || 'bozza').toLowerCase();
                card.innerHTML = `
                    <div class="prev-info">
                        <h3>${c.c1?.cognome || ''} ${c.c1?.nome || ''} ${c.c2?.nome ? '& ' + c.c2.cognome + ' ' + c.c2.nome : ''}</h3>
                        <p>📅 ${c.dataEvento || 'N/D'} | 🎯 ${c.servizio || 'N/D'} | 💰 € ${c.importoTotale || '0.00'}</p>
                        <span class="badge ${badgeClass}">${c.stato || 'Bozza'}</span>
                    </div>
                    <div class="btn-actions">
                        <button class="btn-view" onclick="visualizzaPreventivo(${c.id})">👁️ Visualizza</button>
                        <button class="btn-accept" onclick="accettaPreventivo(${c.id})">✅ Accettato</button>
                        <button class="btn-reject" onclick="rifiutaPreventivo(${c.id})">❌ Rifiutato</button>
                        <button class="btn-pdf" onclick="creaPDF(${c.id})">📄 PDF</button>
                        <button class="btn-delete" onclick="eliminaPreventivo(${c.id})">️ Elimina</button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        function visualizzaPreventivo(id) {
            const c = preventivi.find(x => x.id === id);
            if (!c) return;

            let html = `
                <div class="section-title"> Dati Clienti</div>
                <div class="detail-grid">
                    <div class="detail-item"><label>Cliente 1 - Cognome</label><span>${c.c1?.cognome || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 1 - Nome</label><span>${c.c1?.nome || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 1 - Indirizzo</label><span>${c.c1?.indirizzo || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 1 - Cellulare</label><span>${c.c1?.cellulare || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 1 - Email</label><span>${c.c1?.email || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 2 - Cognome</label><span>${c.c2?.cognome || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 2 - Nome</label><span>${c.c2?.nome || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 2 - Indirizzo</label><span>${c.c2?.indirizzo || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 2 - Cellulare</label><span>${c.c2?.cellulare || '-'}</span></div>
                    <div class="detail-item"><label>Cliente 2 - Email</label><span>${c.c2?.email || '-'}</span></div>
                </div>

                <div class="section-title">🎯 Lavoro Commissionato</div>
                <div class="detail-grid">
                    <div class="detail-item"><label>Tipo di Servizio</label><span>${c.servizio || '-'}</span></div>
                    <div class="detail-item"><label>Data Evento</label><span>${c.dataEvento || '-'}</span></div>
                    <div class="detail-item"><label>Chiesa</label><span>${c.chiesa || '-'}</span></div>
                    <div class="detail-item"><label>Location</label><span>${c.location || '-'}</span></div>
                    <div class="detail-item"><label>Album</label><span>${c.album || '-'}</span></div>
                    <div class="detail-item"><label>Copertina</label><span>${c.copertina || '-'}</span></div>
                    <div class="detail-item"><label>Mini Album</label><span>${c.miniAlbum || '-'}</span></div>
                    <div class="detail-item"><label>Effetti</label><span>${c.effetti || '-'}</span></div>
                    <div class="detail-item"><label>Interni</label><span>${c.interni || '-'}</span></div>
                    <div class="detail-item"><label>Foto nel Book</label><span>${c.fotoBook || '-'}</span></div>
                    <div class="detail-item"><label>Anteprima</label><span>${c.anteprima || '-'}</span></div>
                    <div class="detail-item"><label>Post Servizio</label><span>${c.postServizio || '-'}</span></div>
                    <div class="detail-item"><label>Video</label><span>${c.video || '-'}</span></div>
                    <div class="detail-item"><label>Tela</label><span>${c.tela || '-'}</span></div>
                    <div class="detail-item"><label>Stampe in Carta</label><span>${c.stampeCarta || '-'}</span></div>
                    <div class="detail-item"><label>Mini Pocket</label><span>${c.miniPocket || '-'}</span></div>
                    <div class="detail-item"><label>Pennette USB</label><span>${c.pennette || '-'}</span></div>
                    <div class="detail-item"><label>Servizio Sala Posa</label><span>${c.salaPosa || '-'}</span></div>
                    <div class="detail-item"><label>Servizio Anteprima</label><span>${c.servizioAnteprima || '-'}</span></div>
                </div>

                <div class="section-title">💰 Importo</div>
                <div class="detail-grid">
                    <div class="detail-item" style="background:#fff3cd; border:2px solid #f39c12;">
                        <label>IMPORTO TOTALE IVA ESCLUSA</label>
                        <span style="font-size:1.3em; font-weight:bold; color:#c0392b;">€ ${c.importoTotale || '0.00'}</span>
                    </div>
                </div>

                <div class="section-title">📝 Note</div>
                <div class="detail-item"><span>${c.note || 'Nessuna nota'}</span></div>

                <div class="section-title">📊 Stato</div>
                <div class="detail-item"><span class="badge badge-${(c.stato || 'bozza').toLowerCase()}">${c.stato || 'Bozza'}</span></div>
            `;

            document.getElementById('dettaglioContent').innerHTML = html;
            document.getElementById('dettaglioModal').style.display = 'flex';
        }

        function chiudiModal() {
            document.getElementById('dettaglioModal').style.display = 'none';
        }

        function accettaPreventivo(id) {
            if (!confirm('Sei sicuro di voler accettare questo preventivo? Verrà trasformato in contratto.')) return;
            
            const idx = preventivi.findIndex(c => c.id === id);
            if (idx === -1) return;
            
            preventivi[idx].stato = 'Accettato';
            preventivi[idx].dataAccettazione = new Date().toISOString();
            preventivi[idx].acconti = [];
            
            localStorage.setItem('pietroClienti', JSON.stringify(preventivi));
            alert('✅ Preventivo accettato e trasformato in contratto!');
            caricaPreventivi();
        }

        function rifiutaPreventivo(id) {
            if (!confirm('Sei sicuro di voler rifiutare questo preventivo?')) return;
            
            const idx = preventivi.findIndex(c => c.id === id);
            if (idx === -1) return;
            
            preventivi[idx].stato = 'Rifiutato';
            localStorage.setItem('pietroClienti', JSON.stringify(preventivi));
            alert('❌ Preventivo rifiutato.');
            caricaPreventivi();
        }

        function eliminaPreventivo(id) {
            if (!confirm('Sei sicuro di voler eliminare questo preventivo? Questa azione è irreversibile.')) return;
            
            preventivi = preventivi.filter(c => c.id !== id);
            localStorage.setItem('pietroClienti', JSON.stringify(preventivi));
            alert('️ Preventivo eliminato.');
            caricaPreventivi();
        }

        function creaPDF(id) {
            const c = preventivi.find(x => x.id === id);
            if (!c) return;
            
            let testo = `PIETRO IMPELLIZZERI FOTO & VIDEO\n`;
            testo += `Via Sommariva 43, Capaci (PA)\n`;
            testo += `📧 pietroimpellizzerifotoevideo@gamail.com | 📞 327 498 7435\n\n`;
            testo += `PREVENTIVO N° ${c.id}\n`;
            testo += `Data: ${new Date(c.dataCreazione).toLocaleDateString('it-IT')}\n\n`;
            testo += `CLIENTE 1: ${c.c1?.cognome || ''} ${c.c1?.nome || ''}\n`;
            testo += `Indirizzo: ${c.c1?.indirizzo || '-'}\n`;
            testo += `Cellulare: ${c.c1?.cellulare || '-'}\n`;
            testo += `Email: ${c.c1?.email || '-'}\n\n`;
            if (c.c2?.nome) {
                testo += `CLIENTE 2: ${c.c2?.cognome || ''} ${c.c2?.nome || ''}\n`;
                testo += `Indirizzo: ${c.c2?.indirizzo || '-'}\n\n`;
            }
            testo += `SERVIZIO: ${c.servizio || '-'}\n`;
            testo += `DATA EVENTO: ${c.dataEvento || '-'}\n`;
            testo += `CHIESA: ${c.chiesa || '-'}\n`;
            testo += `LOCATION: ${c.location || '-'}\n\n`;
            testo += `Album: ${c.album || '-'}\n`;
            testo += `Copertina: ${c.copertina || '-'}\n`;
            testo += `Mini Album: ${c.miniAlbum || '-'}\n`;
            testo += `Video: ${c.video || '-'}\n`;
            testo += `Anteprima: ${c.anteprima || '-'}\n\n`;
            testo += `IMPORTO TOTALE IVA ESCLUSA: € ${c.importoTotale || '0.00'}\n\n`;
            testo += `NOTE: ${c.note || 'Nessuna'}\n\n`;
            testo += `Stato: ${c.stato || 'Bozza'}\n`;
            
            const blob = new Blob([testo], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `preventivo_${c.c1?.cognome || 'cliente'}_${c.id}.txt`;
            a.click();
        }

        caricaPreventivi();
    </script>
</body>
</html>
