<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pietro Impellizzeri Foto & VIDEO - Contratti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; }
        .header { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 1.4em; color: #f39c12; }
        .header p { font-size: 0.85em; opacity: 0.9; margin-top: 5px; }
        .nav { display: flex; justify-content: center; gap: 10px; padding: 12px; background: #2c3e50; flex-wrap: wrap; }
        .nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9em; transition: background 0.3s; }
        .nav a:hover { background: #c0392b; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        .section { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .contratti-list { display: grid; gap: 12px; }
        .contratto-card {
            background: #f8f9fa; border-left: 4px solid #27ae60; padding: 15px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .contratto-info h3 { color: #333; font-size: 1em; }
        .contratto-info p { color: #666; font-size: 0.85em; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%;
        }
        .modal-content h2 { color: #c0392b; margin-bottom: 15px; }
        .modal-content .form-group { margin-bottom: 12px; }
        .modal-content label { display: block; font-size: 0.85em; color: #555; margin-bottom: 4px; }
        .modal-content input, .modal-content textarea {
            width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save { background: #27ae60; color: white; }
        .btn-cancel { background: #95a5a6; color: white; }
        .btn-close { background: #e74c3c; color: white; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📜 Contratti Accettati</h1>
        <p>Pietro Impellizzeri Foto & VIDEO | Via Sommariva 43 Capaci (PA)</p>
    </div>
    <div class="nav">
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="clienti.html">📝 Nuovo Preventivo</a>
        <a href="archivio.html">📁 Archivio</a>
        <a href="logout.html">🚪 Esci</a>
    </div>

    <div class="container">
        <div class="section">
            <div class="contratti-list" id="contrattiList"></div>
        </div>
    </div>

    <div class="modal" id="dettaglioModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>📜 Dettaglio Contratto</h2>
                <button class="btn-close" onclick="chiudiModal()">❌ Chiudi</button>
            </div>
            <div id="dettaglioContent"></div>
        </div>
    </div>

    <div class="modal" id="accontoModal">
        <div class="modal-content">
            <h2>💰 Aggiungi Acconto/Caparra</h2>
            <div class="form-group"><label>Data pagamento:</label><input type="date" id="accontoData"></div>
            <div class="form-group"><label>Importo (€):</label><input type="number" id="accontoImporto" step="0.01"></div>
            <div class="form-group"><label>Descrizione:</label><textarea id="accontoDesc" rows="3"></textarea></div>
            <div class="modal-buttons">
                <button class="btn-save" onclick="salvaAcconto()">✅ Salva</button>
                <button class="btn-cancel" onclick="chiudiAccontoModal()">❌ Annulla</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        if (!isAuthenticated()) { window.location.href = 'login.html'; }

        let currentContrattoId = null;

        function caricaContratti() {
            const clienti = JSON.parse(localStorage.getItem('glClienti') || '[]');
            const contratti = clienti.filter(c => c.stato === 'Accettato');
            const lista = document.getElementById('contrattiList');
            lista.innerHTML = '';

            if (contratti.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#999;">Nessun contratto accettato.</p>';
                return;
            }

            contratti.forEach(c => {
                const totAcconti = (c.acconti || []).reduce((s, a) => s + (parseFloat(a.importo) || 0), 0);
                const saldo = (parseFloat(c.importoTotale) || 0) - totAcconti;
                const card = document.createElement('div');
                card.className = 'contratto-card';
                card.innerHTML = `
                    <div class="contratto-info">
                        <h3>${c.c1.cognome} ${c.c1.nome}</h3>
                        <p>📅 ${c.dataEvento || 'N/D'} | 💰 € ${c.importoTotale || '0.00'} | ✅ Incassato: € ${totAcconti.toFixed(2)} | ⏳ Saldo: € ${saldo.toFixed(2)}</p>
                    </div>
                    <div>
                        <button class="btn-save" style="padding:8px 14px;" onclick="apriDettaglio(${c.id})"> Dettagli</button>
                        <button class="btn-save" style="padding:8px 14px; background:#f39c12;" onclick="apriAcconto(${c.id})">💰 Acconto</button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        function apriDettaglio(id) {
            const clienti = JSON.parse(localStorage.getItem('glClienti') || '[]');
            const c = clienti.find(x => x.id === id);
            if (!c) return;
            currentContrattoId = id;
            let html = `<p><strong>Cliente:</strong> ${c.c1.cognome} ${c.c1.nome}</p>`;
            html += `<p><strong>Servizio:</strong> ${c.servizio}</p>`;
            html += `<p><strong>Data Evento:</strong> ${c.dataEvento || 'N/D'}</p>`;
            html += `<p><strong>Importo Totale:</strong> € ${c.importoTotale || '0.00'}</p>`;
            if (c.acconti && c.acconti.length > 0) {
                html += '<h3 style="margin-top:15px; color:#27ae60;">Acconti versati:</h3><ul>';
                c.acconti.forEach(a => {
                    html += `<li>📅 ${a.data} - € ${a.importo} - ${a.descrizione || ''}</li>`;
                });
                html += '</ul>';
            }
            document.getElementById('dettaglioContent').innerHTML = html;
            document.getElementById('dettaglioModal').style.display = 'flex';
        }

        function chiudiModal() { document.getElementById('dettaglioModal').style.display = 'none'; }

        function apriAcconto(id) {
            currentContrattoId = id;
            document.getElementById('accontoModal').style.display = 'flex';
        }

        function chiudiAccontoModal() { document.getElementById('accontoModal').style.display = 'none'; }

        function salvaAcconto() {
            const data = document.getElementById('accontoData').value;
            const importo = document.getElementById('accontoImporto').value;
            const descrizione = document.getElementById('accontoDesc').value;
            if (!data || !importo) { alert('Compila data e importo!'); return; }

            const clienti = JSON.parse(localStorage.getItem('glClienti') || '[]');
            const idx = clienti.findIndex(c => c.id === currentContrattoId);
            if (idx === -1) return;
            if (!clienti[idx].acconti) clienti[idx].acconti = [];
            clienti[idx].acconti.push({ data, importo, descrizione });
            localStorage.setItem('glClienti', JSON.stringify(clienti));
            alert('✅ Acconto salvato!');
            chiudiAccontoModal();
            caricaContratti();
        }

        caricaContratti();
    </script>
</body>
</html>
